<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PulmoLab AR</title>

    <style>
        body {
            margin: 0;
            background: #081421;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

       header {
    padding: 10px 15px;
    background: #10263b;
}

header h1 {
    color: #55d9ed;
    font-size: 24px;
    margin: 4px 0;
}

header p {
    font-size: 12px;
    margin: 4px 0;
    color: #b4c4d8;
}
        .contenedorCamara {
            position: relative;
            width: 95%;
            max-width: 700px;
            height: 500px;
            margin: 20px auto;
            background: #000;
            border: 2px solid #21b8d0;
            border-radius: 15px;
            overflow: hidden;
        }

        #camara {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        button {
            background: #1594aa;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #estado {
            color: #b4c4d8;
            margin: 15px;
        }
    </style>
<!-- Configuración de Three.js para PulmoLab AR -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>
</head>

<body>
<!-- Botón para regresar al simulador principal -->
<a href="./index.html"
   style="
       display: inline-block;
       margin: 15px 20px;
       padding: 12px 20px;
       background: linear-gradient(135deg, #087e99, #00b894);
       color: white;
       border-radius: 10px;
       text-decoration: none;
       font-family: Arial, sans-serif;
       font-weight: bold;
       box-shadow: 0 4px 12px rgba(0, 184, 148, 0.3);
   ">
    ← Volver a PulmoLab 3D
</a>
    <header>
        <h1>🫁 PulmoLab AR</h1>
        <p>Realidad aumentada aplicada a la anatomía pulmonar</p>
    </header>

    <div class="contenedorCamara">

        <video
            id="camara"
            autoplay
            playsinline
            muted>
        </video>

    </div>

    <!-- CONTROLES DE LA CÁMARA -->

<button id="activarCamara" type="button">
    📷 Activar cámara
</button>

<button id="detenerCamara" type="button" disabled>
    ⏹️ Detener cámara
</button>

<button id="cambiarCamara" type="button">
    🔄 Cambiar cámara
</button>

<p id="estado">
    Cámara desactivada
</p>

<script>

// ======================================
// CAMBIAR ENTRE CÁMARA FRONTAL Y TRASERA
// ======================================
const botonCambiarCamara =
    document.getElementById("cambiarCamara");

botonCambiarCamara.addEventListener("click", async () => {

    const videoCambio =
        document.getElementById("camara");

    // Comprobar que la cámara esté encendida
    if (!videoCambio.srcObject) {
        alert("Primero debes activar la cámara.");
        return;
    }

    botonCambiarCamara.disabled = true;

    // Guardar la cámara que estamos utilizando
    const camaraAnterior = tipoCamara;

    // Seleccionar la cámara contraria
    const nuevaCamara =
        tipoCamara === "user"
            ? "environment"
            : "user";

    // Detener la transmisión anterior
    transmision.getTracks().forEach(track => {
        track.stop();
    });

    videoCambio.srcObject = null;

    try {

        // Solicitar la nueva cámara
        const nuevaTransmision =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        exact: nuevaCamara
                    }
                },
                audio: false
            });

        transmision = nuevaTransmision;

        videoCambio.srcObject = transmision;

        await videoCambio.play();

        // Actualizar la cámara seleccionada
        tipoCamara = nuevaCamara;

        // La cámara frontal utiliza efecto espejo
        const usarEspejo = tipoCamara === "user";

        videoCambio.style.transform =
            usarEspejo ? "scaleX(-1)" : "none";

        videoCambio.dataset.mirrored =
            String(usarEspejo);

        console.log(
            "Cámara activa:",
            tipoCamara
        );

    } catch (error) {

        console.error(
            "No se pudo cambiar la cámara:",
            error
        );

        // Intentar recuperar la cámara anterior
        try {

            transmision =
                await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: {
                            ideal: camaraAnterior
                        }
                    },
                    audio: false
                });

            videoCambio.srcObject = transmision;

            await videoCambio.play();

        } catch (errorRecuperacion) {

            console.error(
                "No se pudo recuperar la cámara:",
                errorRecuperacion
            );

        }

        alert(
            "No fue posible cambiar de cámara. " +
            "Comprueba que el dispositivo tenga otra cámara disponible."
        );

    } finally {

        botonCambiarCamara.disabled = false;

    }

});

        const video = document.getElementById("camara");

        const botonActivar =
            document.getElementById("activarCamara");

        const botonDetener =
            document.getElementById("detenerCamara");

        const estado =
            document.getElementById("estado");

        let transmision = null;
// Cámara seleccionada
let tipoCamara = "user";
        async function activarCamara() {

            botonActivar.disabled = true;
            estado.textContent = "Solicitando acceso a la cámara...";

            try {

                if (!navigator.mediaDevices?.getUserMedia) {
                    throw new Error(
                        "Este navegador no permite acceder a la cámara."
                    );
                }

             transmision =
    await navigator.mediaDevices.getUserMedia({

        video: {
            facingMode: {
                ideal: tipoCamara
            }
        },

        audio: false
    });
                video.srcObject = transmision;

                await video.play();

                estado.textContent =
                    "✅ Cámara activada correctamente";

                botonDetener.disabled = false;

            } catch (error) {

                console.error(error);

                detenerCamara();

                estado.textContent =
                    "❌ No se pudo activar la cámara. " +
                    "Revisa los permisos del navegador.";

            }

        }

        function detenerCamara() {

            if (transmision) {

                transmision.getTracks().forEach(track => {
                    track.stop();
                });

                transmision = null;

            }

            video.srcObject = null;

            botonActivar.disabled = false;
            botonDetener.disabled = true;

            estado.textContent = "Cámara desactivada";

        }

        botonActivar.addEventListener(
            "click",
            activarCamara
        );

        botonDetener.addEventListener(
            "click",
            detenerCamara
        );

        window.addEventListener(
            "pagehide",
            detenerCamara
        );

    </script>
<!-- Cargar el modelo pulmonar tridimensional -->
<script type="module" src="./ar.js"></script>
</body>
</html>
